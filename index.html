<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Робо-бой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&family=JetBrains+Mono:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{height:100%;margin:0;background:#0c0f12;overscroll-behavior:none}
[hidden]{display:none!important}
#app{position:fixed!important;left:0;right:0;height:auto!important;
 top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
 bottom:var(--tg-safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<style>
/* Layout: one-screen app — garage menus as scrolling panels, fight as full-bleed canvas with HUD and touch pads */
:root{
  color-scheme:dark;
  --bg:#0c0f12; --panel:#13181d; --panel2:#1a2128; --line:#29323b; --line2:#3a4550;
  --fg:#ebe6da; --mute:#8b96a0; --amber:#f2a51a; --amber2:#ffcf5a; --ink:#1a1206;
  --teal:#38d6c4; --red:#ff4d3d; --green:#86d65e;
  --t0:#b8774a; --t1:#86adc2; --t2:#c792ff; --t3:#ffcf5a;
  --display:'Russo One','Arial Black',Impact,sans-serif;
  --body:'Exo 2','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --hz:repeating-linear-gradient(-45deg,var(--amber) 0 9px,#15110a 9px 18px);
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber2);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#1b2026 0%,var(--bg) 60%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h2{font:24px/1 var(--display);margin:0;letter-spacing:.02em;flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:9px 14px 9px 10px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px);font:13px var(--display);text-transform:uppercase;letter-spacing:.06em}
.back svg{width:16px;height:16px}
.bolts{display:inline-flex;align-items:center;gap:7px;font:700 16px var(--mono);color:var(--amber2);background:#0008;border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.nut{width:17px;height:17px;flex:none;color:var(--amber)}
.btn .nut{width:14px;height:14px;vertical-align:-2px;color:currentColor}
.eyebrow{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);padding:11px 16px;font:14px var(--display);text-transform:uppercase;letter-spacing:.05em;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:filter .12s,transform .08s}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber2)}
.btn.teal{background:var(--teal);color:#05201c;border-color:#7ff0e2}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.dis{opacity:.45}
.btn.danger{color:var(--red)}

.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph>span:first-child{font:15px var(--display);text-transform:uppercase;letter-spacing:.06em}
.ph b{font:700 14px var(--mono);color:var(--amber2)}
.hint{font-size:12px;color:var(--mute)}
.tier{display:inline-block;font:700 10px/1 var(--mono);padding:3px 5px;border:1px solid currentColor;letter-spacing:.06em;vertical-align:2px}
.tier.t0{color:var(--t0)}.tier.t1{color:var(--t1)}.tier.t2{color:var(--t2)}.tier.t3{color:var(--t3)}

/* hangar */
.brand{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.logo{font:clamp(34px,7vw,64px)/.92 var(--display);color:var(--amber);letter-spacing:.01em;text-shadow:0 3px 0 #5a3b07,0 0 32px rgba(242,165,26,.25);text-wrap:balance}
.logo i{font-style:normal;color:var(--fg)}
.sub{font:12px var(--mono);letter-spacing:.38em;color:var(--mute)}
.hang{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media (max-width:780px){.hang{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;min-height:300px;height:clamp(280px,52vh,470px);border:1px solid var(--line);background:
 linear-gradient(180deg,transparent 72%,rgba(0,0,0,.5) 72%),
 radial-gradient(60% 75% at 50% 18%,rgba(242,165,26,.16),transparent 70%),
 repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 64px),
 #0f1317;overflow:hidden}
.stage::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--hz);opacity:.85}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.plate{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:2px;background:#000a;border-left:3px solid var(--amber);padding:8px 12px}
.plate .rn{font:20px var(--display)}
.plate .rp{font:13px var(--mono);color:var(--amber2)}
.stage.small{height:clamp(240px,40vh,330px);min-height:240px}
.menu{display:flex;flex-direction:column;gap:12px}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);padding:16px 18px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transition:transform .1s,filter .12s;position:relative}
.mbtn:hover{filter:brightness(1.15);transform:translateX(3px)}
.mbtn .mt{font:22px var(--display);text-transform:uppercase;letter-spacing:.04em}
.mbtn .ms{font-size:13px;color:var(--mute)}
.mbtn .mx{position:absolute;right:16px;top:16px;font:700 12px var(--mono);color:var(--amber2)}
.mbtn.primary{background:var(--amber);border-color:var(--amber2);color:var(--ink)}
.mbtn.primary .ms{color:#4a3208}.mbtn.primary .mx{color:var(--ink)}
.howto{font-size:13px;color:var(--mute);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.howto kbd{font:700 11px var(--mono);color:var(--fg);background:#0007;border:1px solid var(--line2);padding:2px 6px;border-radius:3px;white-space:nowrap}
.intro{border:1px solid var(--amber);background:linear-gradient(90deg,rgba(242,165,26,.12),transparent);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.intro p{margin:0;flex:1;min-width:220px;max-width:62ch}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.linkbtn{background:none;border:0;color:var(--mute);text-decoration:underline;padding:0;font-size:12px}

/* workshop */
.ws{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:820px){.ws{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute)}
.field input{background:#0009;border:1px solid var(--line2);color:var(--fg);font:18px var(--display);padding:9px 12px;width:100%;-webkit-user-select:text;user-select:text}
.paints{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);background:var(--c);box-shadow:inset 0 0 0 3px var(--bg)}
.sw.on{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--bg),0 0 14px var(--c)}
.srow{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.srow .bar{height:8px;background:#0008;border:1px solid var(--line)}
.srow .bar i{display:block;height:100%;background:linear-gradient(90deg,#b0720f,var(--amber2))}
.srow b{font:700 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.slot{border:1px solid var(--line);background:#0004}
.slot.open{border-color:var(--amber)}
.slot-h{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;background:none;border:0;padding:11px 12px;text-align:left}
.sl-name{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sl-part{display:flex;flex-direction:column;gap:2px;min-width:0}
.sl-part b{font-weight:800;font-size:15px}
.sl-part small{color:var(--mute);font-size:12px}
.pips{display:flex;gap:3px}
.pips i{width:7px;height:12px;background:#0009;border:1px solid var(--line2);transform:skewX(-14deg)}
.pips i.on{background:var(--amber);border-color:var(--amber2)}
.slot-a{display:flex;gap:8px;padding:0 12px 11px;flex-wrap:wrap;align-items:center}
.maxed{font:700 11px var(--mono);color:var(--amber2);letter-spacing:.1em}
.inv{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.inv-empty{font-size:13px;color:var(--mute);padding:4px 0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;background:var(--panel);border:1px solid var(--line)}
.item b{font-weight:800}
.item small{display:block;color:var(--mute);font-size:12px}
.delta{font:700 12px var(--mono)}
.delta.up{color:var(--green)}.delta.dn{color:var(--red)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mods{display:flex;flex-direction:column;gap:6px}
.mod{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--panel);border:1px solid var(--line);padding:9px 10px}
.mod .ck{width:16px;height:16px;border:2px solid var(--line2);margin-top:2px}
.mod.on{border-color:var(--teal)}
.mod.on .ck{background:var(--teal);border-color:var(--teal)}
.mod b{display:block}
.mod small{color:var(--mute);font-size:12px}
.crates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.crate{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);padding:10px}
.crate b{font-size:14px}
.crate small{color:var(--mute);font-size:12px}

/* cards for training & tours */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:16px;position:relative;min-width:0}
.card h3{font:21px/1.1 var(--display);margin:0;text-wrap:balance}
.card p{margin:0;color:var(--mute);font-size:13px}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px var(--mono);color:var(--mute)}
.card .grow{flex:1}
.card.locked{opacity:.55}
.card.won::after{content:"ПРОЙДЕН";position:absolute;right:14px;top:14px;font:11px var(--mono);letter-spacing:.14em;color:var(--green);border:1px solid var(--green);padding:3px 6px;transform:rotate(4deg)}
.cond{border-left:3px solid var(--teal);background:rgba(56,214,196,.07);padding:8px 10px;font-size:13px}
.cond b{display:block;font:12px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--teal)}
.diff{display:flex;gap:3px}
.diff i{width:16px;height:5px;background:#0009;border:1px solid var(--line2)}
.diff i.on{background:var(--red);border-color:var(--red)}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,7,9,.72);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
#modal[hidden]{display:none!important}
.mbox{width:min(640px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#1d252c,#12171b);border:1px solid var(--line2);padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;margin:auto}
.mbox::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--hz)}
.mbox h2{font:clamp(28px,6vw,44px)/1 var(--display);margin:6px 0 0;text-wrap:balance}
.mbox h2.win{color:var(--amber)}
.mbox h2.lose{color:var(--red)}
.mbox p{margin:0;max-width:62ch}
.mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.loot{display:flex;gap:10px;flex-wrap:wrap}
.loot span{font:700 14px var(--mono);background:#0007;border:1px solid var(--line2);padding:6px 10px;color:var(--amber2)}
.vs-cv{width:100%;height:clamp(200px,34vh,300px);display:block;background:radial-gradient(60% 80% at 50% 10%,rgba(242,165,26,.14),transparent),#0c0f12;border:1px solid var(--line)}
.vs-names{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.vs-names div{display:flex;flex-direction:column;min-width:0}
.vs-names div:last-child{text-align:right}
.vs-names b{font:20px var(--display);overflow-wrap:anywhere}
.vs-names span{font:12px var(--mono);color:var(--mute)}
.vs-x{font:30px var(--display);color:var(--red);transform:skewX(-10deg)}
.rewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.rw{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line2);padding:12px;transition:border-color .12s,transform .1s}
.rw:hover{border-color:var(--amber);transform:translateY(-2px)}
.rw b{font-size:15px}
.rw small{color:var(--mute);font-size:12px}
.rw .k{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.chk{font:700 13px var(--mono)}
.chk.ok{color:var(--green)}.chk.fail{color:var(--red)}

#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;background:#000d;border:1px solid var(--amber);padding:10px 16px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* ---------- fight UI ---------- */
#fightui{position:absolute;inset:0;pointer-events:none;touch-action:none;z-index:10}
#hud{position:absolute;top:0;left:0;right:0;padding-top:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start}
.fb{display:flex;flex-direction:column;gap:4px;min-width:0}
.fb.r{align-items:flex-end}
.fb .nm{display:flex;gap:8px;align-items:baseline;font:clamp(13px,2.2vw,19px)/1 var(--display);text-shadow:0 2px 0 #000;max-width:100%}
.fb .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb .nm small{font:11px var(--mono);color:var(--mute)}
.hpw{position:relative;width:100%;height:clamp(13px,2.3vw,22px);background:#000b;border:1px solid #fff2;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.fb.r .hpw{clip-path:polygon(0 0,100% 0,100% 100%,10px 100%)}
.hpw i{position:absolute;inset:0;transform-origin:left;will-change:transform}
.fb.r .hpw i{transform-origin:right}
.hpw .lag{background:#fff}
.hpw .hp{background:linear-gradient(180deg,var(--amber2),var(--amber) 55%,#a86a08)}
.hpw .hp.low{background:linear-gradient(180deg,#ff8a6a,var(--red) 55%,#93200f)}
.enw{position:relative;width:72%;height:7px;background:#000b;border:1px solid #fff2}
.enw i{position:absolute;inset:0;background:var(--teal);transform-origin:left}
.fb.r .enw i{transform-origin:right}
.enw.ready{box-shadow:0 0 12px var(--teal);animation:pulse .7s infinite alternate}
.rpips{display:flex;gap:5px;height:12px}
.rpips i{width:11px;height:11px;transform:rotate(45deg) scale(.8);border:1px solid #fff5;background:#0008}
.rpips i.on{background:var(--amber);border-color:var(--amber2);box-shadow:0 0 8px var(--amber)}
.mid{display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:auto}
#timer{font:700 clamp(22px,4vw,34px)/1 var(--mono);min-width:2.4ch;text-align:center;background:#000b;border:1px solid #fff3;padding:5px 8px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);font-variant-numeric:tabular-nums}
#timer.warn{color:var(--red)}
#pauseBtn{width:34px;height:28px;background:#000a;border:1px solid #fff3;display:grid;place-items:center;padding:0}
#pauseBtn svg{width:12px;height:12px}
#condHud{white-space:nowrap;font:11px var(--mono);background:#000b;padding:4px 8px;border-left:3px solid var(--teal);max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#condHud.fail{border-color:var(--red);color:#ffb3a8}
#condHud.ok{border-color:var(--green)}
#hudwrap{position:relative}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font:clamp(40px,10vw,110px)/1 var(--display);color:var(--amber);-webkit-text-stroke:2px #1b0f00;text-shadow:0 6px 0 #3b2502,0 0 40px rgba(242,165,26,.45);opacity:0;pointer-events:none;letter-spacing:.02em;padding-inline:16px}
#banner.show{animation:bannerIn 1.25s cubic-bezier(.2,.9,.25,1) forwards}
#banner.go{color:#fff}
#banner.ko{color:var(--red);text-shadow:0 6px 0 #3a0a05,0 0 50px rgba(255,77,61,.5)}
#banner.sp{color:var(--teal);font-size:clamp(26px,6vw,64px);top:22%;text-shadow:0 4px 0 #04221e,0 0 40px rgba(56,214,196,.6)}
@keyframes bannerIn{0%{opacity:0;transform:scale(2.2) skewX(-8deg)}14%{opacity:1;transform:scale(1) skewX(-8deg)}78%{opacity:1;transform:scale(1.04) skewX(-8deg)}100%{opacity:0;transform:scale(1.1) skewX(-8deg)}}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.7)}}

#ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;padding-left:max(14px,calc(env(safe-area-inset-left,0px) + 8px));padding-right:max(14px,calc(env(safe-area-inset-right,0px) + 8px));--tb:clamp(52px,13vmin,78px)}
.pad{display:grid;grid-template-columns:var(--tb) var(--tb);gap:10px;pointer-events:auto}
.pad .up{grid-column:1/3;justify-self:center}
.acts{display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;justify-items:center;pointer-events:auto}
.tb{width:var(--tb);height:var(--tb);border-radius:50%;background:rgba(14,18,22,.58);border:2px solid rgba(242,165,26,.55);display:grid;place-items:center;font:11px var(--display);letter-spacing:.05em;color:var(--fg);touch-action:none;-webkit-user-select:none;user-select:none;padding:0}
.tb svg{width:42%;height:42%}
.tb.big{width:calc(var(--tb)*1.2);height:calc(var(--tb)*1.2);font-size:13px;background:rgba(242,165,26,.22)}
.tb.on{background:rgba(242,165,26,.6);color:var(--ink)}
.tb.spec{border-color:#3a6964;color:#6aa59e}
.tb.spec.ready{border-color:var(--teal);color:#fff;box-shadow:0 0 18px var(--teal);animation:pulse .6s infinite alternate}
#keys{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font:11px var(--mono);color:#fff9;background:#0008;padding:5px 10px;white-space:nowrap}
#keys b{color:var(--amber2)}
@media (max-width:700px){#keys{display:none}}
.credits{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.credits span{display:flex;flex-direction:column;gap:1px;border-left:2px solid var(--amber);padding-left:9px}
.credits small{font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.credits b{font:15px var(--display);letter-spacing:.06em}

class AI{
 constructor(lv,passive){this.lv=lv;this.passive=passive;this.t=0.4;this.act='wait';this.blockT=0;this.reacted=null;this.combo=0;this.pressFor=null;this.pressed=false;}
 input(me,op,dt){
  const I={left:false,right:false,block:false,punchP:false,kickP:false,specP:false,jumpP:false};
  if(this.passive)return I;
  const dx=op.x-me.x,dist=Math.abs(dx),dir=dx>=0?1:-1,lv=this.lv;
  const go=d=>{if(d>0)I.right=true;else I.left=true;};
  this.t-=dt;this.blockT-=dt;
  if(op.state==='attack'&&op.atk&&this.reacted!==op.atk&&dist<op.atk.range+70){this.reacted=op.atk;if(me.state!=='attack'&&Math.random()<lv*0.6)this.blockT=0.25+Math.random()*0.35;}
  if(this.blockT>0&&me.state!=='attack'&&me.grounded){I.block=true;return I;}
  if(this.t<=0){
   this.t=0.1+(1-lv)*0.45+Math.random()*0.2;const r=Math.random();
   if(me.en>=100&&dist<240&&r<0.35+lv*0.45)this.act='spec';
   else if(dist>150)this.act=r<0.06+lv*0.06?'jump':'approach';
   else if(dist<70&&r<0.25)this.act='retreat';
   else if(r<0.25+lv*0.55){this.act=Math.random()<0.6?'punch':'kick';this.combo=Math.floor(Math.random()*(1+lv*2.6));this.pressFor=null;this.pressed=false;}
   else if(r<0.88)this.act='wait';else this.act='retreat';
  }
  switch(this.act){
   case 'approach':go(dir);if(dist<125)this.t=0;break;
   case 'retreat':go(-dir);break;
   case 'jump':I.jumpP=true;go(dir);this.act='airatk';break;
   case 'airatk':go(dir);if(!me.grounded&&dist<150&&Math.random()<0.2){I.kickP=true;this.act='wait';}break;
   case 'spec':if(dist>165)go(dir);else{I.specP=true;this.act='wait';}break;
   case 'punch':case 'kick':
    if(dist>(this.act==='kick'?145:112)&&!this.pressed)go(dir);
    else if(!this.pressed){if(this.act==='punch')I.punchP=true;else I.kickP=true;this.pressed=true;}
    else if(this.act==='punch'&&this.combo>0&&me.state==='attack'&&me.atk&&me.atk!==this.pressFor&&me.atk.t>me.atk.su/me.aspd){I.punchP=true;this.pressFor=me.atk;this.combo--;}
    break;
  }
  return I;
 }
}

   const g=c.createRadialGradient(x,gy,0,x,gy,90*s);g.addColorStop(0,rgba(pu.look.accent,0.28));g.addColorStop(1,rgba(pu.look.accent,0));c.fillStyle=g;c.fillRect(x-90*s,gy-90*s,180*s,180*s);
   c.fillStyle='#1d242b';c.beginPath();c.ellipse(x,gy+6*s,62*s,12*s,0,0,7);c.fill();c.strokeStyle=rgba(pu.look.accent,0.7);c.lineWidth=2;c.beginPath();c.ellipse(x,gy+3*s,62*s,12*s,0,Math.PI,0,true);c.stroke();
   c.fillStyle='rgba(0,0,0,.5)';c.beginPath();c.ellipse(x,gy,44*s,7*s,0,0,7);c.fill();

   </div>
  </div>
  <div class="foot"><span>${TG?'Игрок '+esc(tgName())+' · прогресс сохраняется в Telegram':'Прогресс хранится в этом браузере'} · боёв проведено: ${SAVE.fights}</span><span><button class="linkbtn" data-act="reset">${RESET_ARM?'Нажми ещё раз, чтобы стереть всё':'Начать заново'}</button></span></div>
 </div>`;
}
let RESET_ARM=false;
let WS={sel:'arms',scrap:null};
function renderWorkshop(){
 refreshPlayerPuppet();
 const parts=playerParts(),st=calcStats(parts,SAVE.modEq),pw=power(st);
 const statRows=Object.keys(STAT_NAME).map(k=>`<div class="srow"><span>${STAT_NAME[k]}</span><span class="bar"><i style="width:${clamp(st[k]/STAT_MAX[k]*100,2,100).toFixed(1)}%"></i></span><b>${st[k]}</b></div>`).join('');
 const slotRow=sl=>{
  const it=itemBy(SAVE.eq[sl]),P=PART[it.id],c=upCost(it),open=WS.sel===sl;
  let inv='';
  if(open){
   const list=SAVE.inv.filter(x=>PART[x.id].slot===sl&&x.uid!==it.uid).sort((a,b)=>PART[b.id].tier-PART[a.id].tier||b.lvl-a.lvl);
   inv=`<div class="inv">${list.length?list.map(x=>{const Q=PART[x.id];const alt=parts.map(y=>y.uid===it.uid?x:y);const d=power(calcStats(alt,SAVE.modEq))-pw;
     return`<div class="item"><div><b>${Q.name}</b> ${tierB(Q.tier)} <span class="delta ${d>=0?'up':'dn'}">${d>=0?'+':''}${d} мощи</span><small>ур. ${x.lvl} · ${partStats(Q,x.lvl)}</small></div><div class="acts"><button class="btn sm primary" data-act="equip:${x.uid}">Поставить</button><button class="btn sm danger" data-act="scrap:${x.uid}">${WS.scrap===x.uid?'Точно разобрать?':'Разобрать +'+scrapVal(x)}</button></div></div>`;}).join(''):`<div class="inv-empty">Других деталей для этого слота нет. Их дают за турниры и в ящиках ниже.</div>`}</div>`;
  }
  return`<div class="slot ${open?'open':''}"><button class="slot-h" data-act="sel:${sl}" aria-expanded="${open}"><span class="sl-name">${SLOT_NAME[sl]}</span><span class="sl-part"><b>${P.name} ${tierB(P.tier)}</b><small>${partStats(P,it.lvl)}</small></span>${lvlPips(it.lvl)}</button>
   <div class="slot-a">${it.lvl<5?`<button class="btn sm ${SAVE.bolts>=c?'':'dis'}" data-act="up:${it.uid}">Улучшить · ${NUT} ${c}</button>`:`<span class="maxed">МАКС. УРОВЕНЬ</span>`}<span class="hint">${open?'':'нажми на слот, чтобы сменить деталь'}</span></div>${inv}</div>`;
 };
 const mods=SAVE.mods.length?`<div class="mods">${SAVE.mods.map(id=>{const m=MOD[id],on=SAVE.modEq.includes(id);return`<button class="mod ${on?'on':''}" data-act="mod:${id}" aria-pressed="${on}"><span class="ck"></span><span><b>${m.name}</b><small>${m.desc}</small></span></button>`;}).join('')}</div>`:`<div class="inv-empty">Модули выдают за выполнение особых условий турниров.</div>`;
 const crates=`<div class="crates">${CRATES.map((cr,i)=>{const lock=cr.req&&!SAVE.won.includes(cr.req);return`<div class="crate"><b>${cr.name}</b><small>${lock?'Откроется после турнира «'+TOURS.find(t=>t.id===cr.req).name+'»':cr.desc}</small><button class="btn sm ${lock||SAVE.bolts<cr.cost?'dis':''}" data-act="crate:${i}">${NUT} ${cr.cost}</button></div>`;}).join('')}</div>`;
 $('#s-workshop').innerHTML=`<div class="wrap">${topbar('Мастерская')}
  <div class="ws">
   <div class="col">
    <div class="stage small"><canvas class="pv" data-pv="player"></canvas><div class="plate"><span class="rn">${esc(SAVE.name)}</span><span class="rp">Мощь ${pw}</span></div></div>
    <label class="field" for="rname"><span>Имя робота</span><input id="rname" maxlength="16" value="${esc(SAVE.name)}" autocomplete="off"></label>
    <div class="field"><span>Цвет подсветки</span><div class="paints">${PAINTS.map((c,i)=>`<button class="sw ${i===SAVE.paint?'on':''}" style="--c:${c}" data-act="paint:${i}" aria-label="Цвет ${i+1}"></button>`).join('')}</div></div>
    <div class="panel"><div class="ph"><span>Характеристики</span><b>Мощь ${pw}</b></div>${statRows}</div>
   </div>
   <div class="col">
    <div class="panel"><div class="ph"><span>Детали</span><span class="hint">Улучшение: +15% к бонусам детали за уровень</span></div>${SLOTS.map(slotRow).join('')}</div>
    <div class="panel"><div class="ph"><span>Модули</span><span class="hint">${SAVE.modEq.length}/${modSlots()} установлено</span></div>${mods}</div>
    <div class="panel"><div class="ph"><span>Ящики с деталями</span></div>${crates}</div>
   </div>
  </div></div>`;
 const inp=$('#rname');inp.addEventListener('input',()=>{SAVE.name=inp.value.trim().slice(0,16)||'Ржавчик';persist();const rn=$('#s-workshop .rn');if(rn)rn.textContent=SAVE.name;});
}
function renderTraining(){
 $('#s-training').innerHTML=`<div class="wrap">${topbar('Тренировка')}
  <p class="hint" style="margin:0;max-width:62ch">Спарринг в гараже. Поражение ничего не стоит, а за победу дают немного болтов.</p>
  <div class="cards">${SPARS.map((sp,i)=>`<div class="card"><div class="meta"><span>Сложность</span><span class="diff">${[1,2,3].map(k=>`<i class="${k<=sp.diff?'on':''}"></i>`).join('')}</span></div><h3>${sp.name}</h3><p>${sp.desc}</p><div class="grow"></div><div class="meta"><span>Награда за победу:</span><span class="bolts">${NUT}<span>${sp.reward}</span></span></div><button class="btn ${i===0?'':'primary'}" data-act="spar:${i}">Начать спарринг</button></div>`).join('')}</div></div>`;
}
function renderTours(){
 $('#s-tours').innerHTML=`<div class="wrap">${topbar('Турниры')}
  <p class="hint" style="margin:0;max-width:62ch">Три боя подряд, каждый до двух побед в раундах. Выполни особое условие — и выберешь награду: редкую деталь или модуль. После победы условие меняется.</p>
  <div class="cards">${TOURS.map((T,i)=>{const unlocked=i===0||SAVE.won.includes(TOURS[i-1].id),won=SAVE.won.includes(T.id),c=CONDS[getCond(i)];
   return`<div class="card ${unlocked?'':'locked'} ${won?'won':''}"><div class="meta">${tierB(T.tier)}<span>Арена: ${ARENA_DEF[T.arena].name}</span></div><h3>${T.name}</h3><p>${T.blurb}</p><div class="cond"><b>Условие: ${c.name}</b>${c.desc}</div><div class="grow"></div><div class="meta"><span>Призовые:</span><span class="bolts">${NUT}<span>${T.prize}</span></span></div>${unlocked?`<button class="btn primary" data-act="tour:${i}">${won?'Сыграть снова':'Участвовать'}</button>`:`<button class="btn dis" disabled>Сначала выиграй «${TOURS[i-1].name}»</button>`}</div>`;}).join('')}</div></div>`;
}

/* ---------- flows ---------- */
let VS=null,RUN=null,REWARDS=null;
function showVS(o){
 VS=o;const pl=new Fighter(playerCfg()),en=new Fighter(o.enemy);
 PV.vsL=new Puppet(pl.look,1);PV.vsR=new Puppet(en.look,-1);
 showModal(`<span class="eyebrow">${o.eyebrow}</span><canvas class="pv vs-cv" data-pv="vs"></canvas>
  <div class="vs-names"><div><b>${esc(pl.name)}</b><span>мощь ${power(pl.st)} · ${pl.spName}</span></div><div class="vs-x">VS</div><div><b>${esc(en.name)}</b><span>мощь ${power(en.st)} · ${en.spName}</span></div></div>
  ${o.cond?`<div class="cond"><b>Условие: ${CONDS[o.cond].name}${o.prevFail?' — уже провалено':''}</b>${CONDS[o.cond].desc}</div>`:''}
  <div class="mrow"><button class="btn" data-act="vsback">${o.backLabel||'Назад'}</button><button class="btn primary" data-act="vsgo">В бой</button></div>`);
}
function beginMatch(enemy,opts){
 closeModal();for(const s of SCREENS)$('#s-'+s).hidden=true;CV.hidden=false;$('#fightui').hidden=false;
 $('#ctrl').hidden=!touchUI;$('#keys').hidden=touchUI;
 G=new Game(enemy,opts);setMusic('fight');syncBack();
}
function leaveMatch(to){G=null;closeModal();show(to||'hangar');}
function startSpar(i){
 const S=SPARS[i];const en=genEnemy(S.name,S.tier,S.lvl,PAINTS[(i+3)%PAINTS.length],false);if(S.passive)en.mods=[];
 showVS({eyebrow:'Тренировка · гараж',enemy:en,go:()=>beginMatch(en,{arena:'garage',ai:S.ai,passive:S.passive,onEnd:(won)=>{
  const r=won?S.reward:0;SAVE.bolts+=r;persist();if(r)SFX.coin();
  setTimeout(()=>showModal(`<span class="eyebrow">Тренировка</span><h2 class="${won?'win':'lose'}">${won?'Победа':'Поражение'}</h2><p>${won?'Спарринг выигран.':'Ничего страшного: на тренировке детали не ломаются.'}</p>${r?`<div class="loot"><span>+${r} болтов</span></div>`:''}<div class="mrow"><button class="btn" data-act="leave:hangar">В ангар</button><button class="btn" data-act="leave:workshop">В мастерскую</button><button class="btn primary" data-act="spar:${i}">Ещё раз</button></div>`),900);
 }})});
}
function startTour(ti){
 const T=TOURS[ti];
 RUN={ti,fight:0,enemies:T.names.map((n,i)=>genEnemy(n,T.tier,Math.min(5,T.tier+i),PAINTS[(ti*3+i+1)%PAINTS.length],i<2)),fsList:[],cond:getCond(ti)};
 tourVS();
}
function condCheck(c,fs){switch(c){case 'special':return fs.specialHits>0;case 'noBlock':return !fs.blocked;case 'hp50':return fs.endHp>0.5;case 'noRoundLost':return fs.roundsLost===0;case 'kicksOnly':return fs.punchDmg===0;case 'punchesOnly':return fs.kickDmg===0;case 'fast':return fs.time<70;}return false;}
function tourVS(){
 const T=TOURS[RUN.ti],en=RUN.enemies[RUN.fight],prevFail=RUN.fsList.some(f=>!condCheck(RUN.cond,f));
 showVS({eyebrow:`${T.name} · бой ${RUN.fight+1} из 3`,enemy:en,cond:RUN.cond,prevFail,backLabel:RUN.fight?'Сдаться':'Назад',go:()=>beginMatch(en,{arena:T.arena,ai:T.ai[RUN.fight],cond:RUN.cond,prevFail,onEnd:tourFightEnd})});
}
function tourFightEnd(won,fs){
 const T=TOURS[RUN.ti];RUN.fsList.push(fs);const ok=condCheck(RUN.cond,fs);const cn=CONDS[RUN.cond].name;
 const chk=v=>`<span class="chk ${v?'ok':'fail'}">${cn}: ${v?'выполнено':'провалено'}</span>`;
 if(!won){const cons=10*RUN.fight,fno=RUN.fight+1;SAVE.bolts+=cons;persist();const ti=RUN.ti;RUN=null;
  setTimeout(()=>showModal(`<span class="eyebrow">${T.name}</span><h2 class="lose">Турнир окончен</h2><p>Тебя выбили в бою ${fno} из 3. Подтяни детали в мастерской и возвращайся.</p>${cons?`<div class="loot"><span>+${cons} болтов за выигранные бои</span></div>`:''}<div class="mrow"><button class="btn" data-act="leave:hangar">В ангар</button><button class="btn" data-act="leave:workshop">В мастерскую</button><button class="btn primary" data-act="tour:${ti}">Заново</button></div>`),900);return;}
 if(RUN.fight<2){RUN.fight++;const nx=RUN.enemies[RUN.fight];
  setTimeout(()=>showModal(`<span class="eyebrow">${T.name} · бой ${RUN.fight} из 3</span><h2 class="win">Победа</h2><p>Корпус подлатали. Следующий соперник: <b>${esc(nx.name)}</b>.</p><div class="loot">${chk(ok)}</div><div class="mrow"><button class="btn" data-act="abandon">Сдаться</button><button class="btn primary" data-act="nextfight">Следующий бой</button></div>`),900);return;}
 const allOk=RUN.fsList.every(f=>condCheck(RUN.cond,f));const total=RUN.fsList.reduce((a,f)=>a+f.time,0);const first=!SAVE.won.includes(T.id);
 SAVE.bolts+=T.prize;if(first)SAVE.won.push(T.id);
 const pool=Object.keys(CONDS).filter(k=>k!==RUN.cond);SAVE.conds[T.id]=pick(pool);persist();SFX.coin();
 if(allOk){REWARDS=genRewards(T.tier);
  setTimeout(()=>showModal(`<span class="eyebrow">${T.name}</span><h2 class="win">Чемпион!</h2><p>Условие «${cn}» выполнено во всех боях. Выбери награду.</p><div class="loot"><span>+${T.prize} болтов</span><span>Время ${fmtTime(total)}</span>${first&&T.id==='t2'?'<span>+1 слот модуля</span>':''}</div>
   <div class="rewards">${REWARDS.map((r,i)=>{if(r.kind==='mod'){const m=MOD[r.id];return`<button class="rw" data-act="reward:${i}"><span class="k">Модуль</span><b>${m.name}</b><small>${m.desc}</small></button>`;}const Q=PART[r.id];return`<button class="rw" data-act="reward:${i}"><span class="k">${SLOT_NAME[Q.slot]} ${tierB(Q.tier)}</span><b>${Q.name}</b><small>${partStats(Q,0)}</small></button>`;}).join('')}</div>`),900);
 }else{RUN=null;
  setTimeout(()=>showModal(`<span class="eyebrow">${T.name}</span><h2 class="win">Чемпион!</h2><p>Турнир выигран, но особое условие провалено, поэтому редкая награда в этот раз не досталась. Условие турнира сменилось.</p><div class="loot"><span>+${T.prize} болтов</span><span>Время ${fmtTime(total)}</span><span class="chk fail">${cn}: провалено</span></div><div class="mrow"><button class="btn" data-act="leave:tours">К турнирам</button><button class="btn primary" data-act="leave:workshop">В мастерскую</button></div>`),900);}
}
function genRewards(T){
 const out=[],used=new Set(),hi=Math.min(3,T+1);
 for(const tier of[hi,hi===T?T:Math.random()<0.5?hi:T]){let p=null;for(let k=0;k<25;k++){p=pick(PARTS.filter(x=>x.tier===tier));if(!used.has(p.id)&&!(out.length&&PART[out[0].id].slot===p.slot&&k<20))break;}used.add(p.id);out.push({kind:'part',id:p.id});}
 const free=MODS.filter(m=>!SAVE.mods.includes(m.id));
 if(free.length)out.push({kind:'mod',id:pick(free).id});else{let p;do{p=pick(PARTS.filter(x=>x.tier===T));}while(used.has(p.id)&&used.size<6);out.push({kind:'part',id:p.id});}
 return out;
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const[act,arg]=el.dataset.act.split(':');SFX.ui();haptic('select');
 switch(act){
  case 'go':RESET_ARM=false;WS.scrap=null;show(arg);break;
  case 'intro':SAVE.intro=true;persist();renderHangar();break;
  case 'snd':openSettings(G&&G.paused?'pause':'menu');break;
  case 'sndon':SAVE.audio.on=!SAVE.audio.on;persist();applyAudio();if(SAVE.audio.on)SFX.ui();openSettings(SETTINGS_FROM);break;
  case 'sndtest':SFX[arg](arg==='hit'?1.6:undefined);break;
  case 'snddone':closeSettings();break;
  case 'reset':if(RESET_ARM){SAVE=newSave();persist();RESET_ARM=false;PV.player=null;toast('Прогресс сброшен');}else RESET_ARM=true;renderHangar();break;
  case 'sel':WS.sel=WS.sel===arg?null:arg;WS.scrap=null;renderWorkshop();break;
  case 'equip':{const it=itemBy(+arg);SAVE.eq[PART[it.id].slot]=it.uid;WS.scrap=null;persist();renderWorkshop();refreshPlayerPuppet(true);break;}
  case 'up':{const it=itemBy(+arg),c=upCost(it);if(it.lvl>=5)break;if(SAVE.bolts<c){toast(`Не хватает болтов: нужно ${c}`);break;}SAVE.bolts-=c;it.lvl++;persist();SFX.coin();renderWorkshop();refreshPlayerPuppet(true);toast(`${PART[it.id].name}: уровень ${it.lvl}`);break;}
  case 'scrap':{const uid=+arg;if(WS.scrap!==uid){WS.scrap=uid;renderWorkshop();break;}const it=itemBy(uid);if(!it||Object.values(SAVE.eq).includes(uid))break;const v=scrapVal(it);SAVE.inv=SAVE.inv.filter(x=>x.uid!==uid);SAVE.bolts+=v;WS.scrap=null;persist();SFX.coin();renderWorkshop();toast(`Разобрано: +${v} болтов`);break;}
  case 'mod':{const i=SAVE.modEq.indexOf(arg);if(i>=0)SAVE.modEq.splice(i,1);else if(SAVE.modEq.length<modSlots())SAVE.modEq.push(arg);else{toast('Все слоты модулей заняты — сними какой-нибудь');break;}persist();renderWorkshop();break;}
  case 'paint':SAVE.paint=+arg;persist();renderWorkshop();refreshPlayerPuppet(true);break;
  case 'crate':{const cr=CRATES[+arg];if(cr.req&&!SAVE.won.includes(cr.req)){toast('Этот ящик пока закрыт');break;}if(SAVE.bolts<cr.cost){toast(`Не хватает болтов: нужно ${cr.cost}`);break;}SAVE.bolts-=cr.cost;const P=pick(PARTS.filter(x=>x.tier===pick(cr.tiers)));const it=addPart(P.id);WS.sel=P.slot;persist();SFX.coin();renderWorkshop();toast(`Из ящика: ${P.name} (Т${P.tier}, ${SLOT_NAME[P.slot].toLowerCase()})`);void it;break;}
  case 'spar':closeModal();G=null;startSpar(+arg);break;
  case 'tour':closeModal();G=null;startTour(+arg);break;
  case 'vsgo':if(VS)VS.go();break;
  case 'vsback':closeModal();RUN=null;G=null;show(CUR);break;
  case 'nextfight':closeModal();G=null;tourVS();break;
  case 'abandon':RUN=null;leaveMatch('tours');break;
  case 'leave':leaveMatch(arg);break;
  case 'reward':{const r=REWARDS&&REWARDS[+arg];if(!r)break;if(r.kind==='mod'){SAVE.mods.push(r.id);if(SAVE.modEq.length<modSlots())SAVE.modEq.push(r.id);}else{const it=addPart(r.id);WS.sel=PART[r.id].slot;void it;}persist();REWARDS=null;RUN=null;leaveMatch('workshop');toast(r.kind==='mod'?`Модуль «${MOD[r.id].name}» установлен`:`Деталь «${PART[r.id].name}» в мастерской`);break;}
  case 'resume':resume();break;
  case 'forfeit':closeModal();if(G)G.forfeit();break;
 }
});
$('#pauseBtn').addEventListener('click',e=>{e.stopPropagation();if(G&&G.phase!=='over')pauseGame();});
function pauseGame(){if(!G||G.paused)return;G.paused=true;setMusic('pause');pauseMenu();}
function pauseMenu(){showModal(`<span class="eyebrow">Пауза</span><h2>Перерыв</h2><p>Бой остановлен.</p><div class="mrow"><button class="btn" data-act="snd">Звук</button><button class="btn danger" data-act="forfeit">Сдаться</button><button class="btn primary" data-act="resume">Продолжить</button></div>`);}
function resume(){if(!G)return;G.paused=false;setMusic('fight');closeModal();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.phase!=='over')pauseGame();if(SND.ctx){try{if(document.hidden)SND.ctx.suspend();else if(SAVE.audio.on)SND.ctx.resume();}catch(e){}}});

/* ---------- sound settings ---------- */
let SETTINGS_FROM='menu',SETTINGS_ON=false,persistT=null;
function persistSoon(){clearTimeout(persistT);persistT=setTimeout(persist,400);}
const SND_ROWS=[['master','Общая громкость',''],['sfx','Удары и эффекты',''],['music','Музыка','Индустриальный бит: тихий в меню, в полную силу в бою'],['hard','Жёсткость металла','Сколько скрежета, звона и перегруза в ударах']];
function openSettings(from){
 SETTINGS_FROM=from;const A=SAVE.audio;
 showModal(`<span class="eyebrow">Настройки</span><h2>Звук</h2><div class="snd">
  <button class="toggle" data-act="sndon" aria-pressed="${A.on}"><b>Звук ${A.on?'включён':'выключен'}</b><span class="sw2"></span></button>
  ${SND_ROWS.map(([k,l,h])=>`<div class="srng"><label for="snd-${k}">${l}</label><output id="o-${k}">${Math.round(A[k]*100)}</output><input type="range" id="snd-${k}" data-snd="${k}" min="0" max="100" step="1" value="${Math.round(A[k]*100)}"${A.on?'':' disabled'}>${h?`<small>${h}</small>`:''}</div>`).join('')}
  <div class="field"><span>Проверить</span><div class="tests"><button class="btn sm" data-act="sndtest:hit">Удар</button><button class="btn sm" data-act="sndtest:block">Блок</button><button class="btn sm" data-act="sndtest:special">Спецприём</button><button class="btn sm" data-act="sndtest:ko">Нокаут</button></div></div>
 </div><div class="mrow"><button class="btn primary" data-act="snddone">Готово</button></div>`);
 SETTINGS_ON=true;
}
function closeSettings(){SETTINGS_ON=false;if(SETTINGS_FROM==='pause'&&G&&G.paused)pauseMenu();else closeModal();}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.snd;if(!k)return;SAVE.audio[k]=(+e.target.value)/100;const o=$('#o-'+k);if(o)o.textContent=e.target.value;audio();applyAudio();persistSoon();});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.snd;if(k==='hard'||k==='sfx')SFX.hit(1.6);});

const fmtTime=s=>`${Math.floor(s/60)}:${(s%60).toFixed(1).padStart(4,'0')}`;

/* ======================= loop ======================= */
let last=performance.now();
function frame(now){
 const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;NOW+=dt;
 try{
  if(G&&G.active){if(!G.paused)G.update(dt);G.draw();}
  if(!G||!$('#modal').hidden)drawPreview(dt);
 }catch(err){console.error(err);}
 requestAnimationFrame(frame);
}
async function boot(){if(TG)await tgInit();show('hangar');requestAnimationFrame(t=>{last=t;frame(t);});}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot();
</script>
